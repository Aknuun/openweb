name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n openweb

      - name: ShellCheck
        run: shellcheck -x openweb

      - name: JavaScript syntax check
        run: node --check openweb-ui.js
